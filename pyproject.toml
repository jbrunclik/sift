[project]
name = "sift"
version = "0.1.0"
description = "Sift — personal news aggregator with LLM-powered relevance scoring"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.154.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "google-genai>=2.30.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "apscheduler>=4.0.0a6",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.10.0",
    "respx>=0.23.1",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "apscheduler",
    "apscheduler.schedulers.async_",
    "apscheduler.triggers.interval",
    "apscheduler.triggers.cron",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
